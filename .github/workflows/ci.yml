name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: linkpulse
          POSTGRES_PASSWORD: linkpulse
          POSTGRES_DB: linkpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linkpulse" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet -tags integration ./...
      - name: unit tests
        run: go test -race ./...
      - name: integration tests
        env:
          DATABASE_URL: postgres://linkpulse:linkpulse@localhost:5432/linkpulse?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: go test -race -tags integration -count=1 ./internal/
      - name: docker build
        run: docker build -t linkpulse .
